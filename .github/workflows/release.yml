name: Build firmware

on:
  release:
    types: [published]
  pull_request:
    paths: ["esphome/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - yaml: innotech-genesis.yaml
            asset: innotech-genesis-t-rss3            # RS485 port (the controllers' Net)
          - yaml: innotech-genesis-rs232.yaml
            asset: innotech-genesis-t-rss3-rs232      # RS232 port (one panel's front DB9)
    steps:
      - uses: actions/checkout@v7

      - name: Build ESPHome firmware
        id: esphome
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome/${{ matrix.yaml }}
          version: 2026.10.2

      - name: Collect binaries
        run: |
          mkdir dist
          src="${{ steps.esphome.outputs.name }}"
          cp "$src/$src.factory.bin" "dist/${{ matrix.asset }}.factory.bin"
          cp "$src/$src.ota.bin" "dist/${{ matrix.asset }}.ota.bin"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
